# Basilrun Books — plain static site served from the repo root.
# The previous Node generator (scripts/build.mjs -> dist/) was retired in the
# dark v3 redesign. It is preserved on the archive/pre-dark-redesign branch.

[build]
publish = "."

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
